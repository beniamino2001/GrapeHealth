# Reverse proxy dimostrativo: espone la sola dashboard (istanza Tomcat "dashboard",
# porta 8085 interna) su un endpoint HTTPS con nome DNS; qui ristretto a 127.0.0.1
# perché resta un ambiente locale, non un servizio realmente esposto in rete.
#
# grapehealth.localhost non richiede alcuna voce in /etc/hosts: il TLD .localhost
# è riservato dalla RFC 6761 e risolto a 127.0.0.1 automaticamente dal sistema
# operativo e dai browser moderni, qualunque sottodominio si usi.

server {
    listen 443 ssl;
    http2 on;
    server_name grapehealth.localhost;

    # Non annuncia la versione esatta di nginx nell'header Server.
    server_tokens off;

    # Intestazioni di sicurezza di base, "always" le include anche
    # sulle risposte di errore (es. un 502 se il backend non è ancora pronto), non
    # solo sulle 200.
    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "DENY" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    # Policy di allow per ogni risorsa esterna caricata dalla dashboard.
    add_header Content-Security-Policy   "default-src 'self'; script-src 'self' https://cdnjs.cloudflare.com; connect-src 'self' https://localhost:8084; style-src 'self'; img-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

    ssl_certificate     /etc/nginx/certs/nginx.crt;
    ssl_certificate_key /etc/nginx/certs/nginx.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    # Solo suite ECDHE con forward secrecy, autenticazione RSA coerenti con i certificati generati da
    # genera-certificati-tls.sh e cifratura autenticata AES-GCM/ChaCha20.
    # off, non on: lascia al client la scelta fra AES-GCM e ChaCha20-Poly1305 in base a quale
    # accelerazione hardware possiede (raccomandazione Mozilla).
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;

    location / {
        # Il backend (Tomcat, istanza dashboard) è definito già per parlare solo HTTPS:
        # qui si verifica la sua identità con la stessa CA locale di tutto
        # il resto del progetto, non ci si limita a cifrare il canale.
        proxy_pass https://tomcat:8085;
        proxy_ssl_trusted_certificate /etc/nginx/certs/ca.crt;
        proxy_ssl_verify        on;
        proxy_ssl_verify_depth  2;
        proxy_ssl_name          tomcat;
        proxy_ssl_server_name   on;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}