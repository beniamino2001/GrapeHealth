spring:
  application:
    name: api
  datasource:
    url: jdbc:postgresql://${PG_HOST:localhost}:${PG_PORT:5432}/${POSTGRES_DB}?sslmode=${POSTGRES_SSL_MODE:verify-full}&sslrootcert=${PG_SSL_ROOT_CERT}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: alpha
    tagsSorter: alpha
  api-docs:
    path: /v3/api-docs

logging:
  file:
    name: ${SPRING_BOOT_LOGS_DIR:${user.home}/Downloads}/grapehealth-api.log

server:
  port: 8084
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
    include-exception: false
    whitelabel:
      enabled: false