spring:
  application:
    name: persistence
  datasource:
    url: jdbc:postgresql://${PG_HOST:localhost}:${PG_PORT:5432}/${POSTGRES_DB}?sslmode=${POSTGRES_SSL_MODE:verify-full}&sslrootcert=${PG_SSL_ROOT_CERT}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          batch_size: 50
        order_inserts: true
    open-in-view: false
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_AMQP_PORT:5672}
    username: ${RABBITMQ_USER}
    password: ${RABBITMQ_PASS}
    virtual-host: /
    listener:
      simple:
        # Si applica solo al listener basato su @RabbitListener: tre tentativi 
        # con backoff prima di rifiutare il messaggio, che a quel punto viene 
        # dead-lettered dalla coda invece di essere reinviato all'infinito. Il
        # retry ha senso qui perché un fallimento potrebbe essere transitorio
        # (es. un deadlock momentaneo su PostgreSQL), non solo permanente come
        # nel caso di un tipo di allerta non riconosciuto.
        retry:
          enabled: true
          initial-interval: 500ms
          multiplier: 2.0
          max-interval: 5s
          max-retries: 3
        default-requeue-rejected: false

logging:
  file:
    name: ${SPRING_BOOT_LOGS_DIR:${user.home}/Downloads}/grapehealth-persistence.log
  structured:
    format:
      file: ecs

server:
  port: 8083