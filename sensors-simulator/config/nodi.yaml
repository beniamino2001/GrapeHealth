# Configurazione del simulatore GrapeHealth.
# Basta modificare qui scenario e velocità del tempo senza toccare il codice.

mqtt:
  # Cambiare questa chiave da sola instraderebbe silenziosamente ogni misurazione 
  # verso il nulla, per questo valida_config() in main.py lo verifica all'avvio.
  topic_prefix: "grapehealth"

simulazione:
  # 1 = tempo reale (un secondo simulato = un secondo reale)
  # >1 = tempo compresso, es. 288 fa scorrere un giorno simulato in 5 minuti reali (86400/288=300s)
  # Sovrascrivibile da riga di comando con --time-scale
  time_scale: 1

  # Intervallo fra due letture consecutive, in SECONDI SIMULATI. 900 (15 minuti
  # simulati) è coerente con la cadenza reale di una centralina agrometeorologica
  # a batteria. La durata delle regole a soglia nel
  # decision engine è tracciata sul tempo trascorso fra i timestamp, non sul
  # numero di letture: un intervallo più largo non compromette le soglie a
  # durata più breve (es. sunburn, 15 minuti).
  #
  # A time_scale alti c'è anche un secondo motivo per restare larghi: sotto
  # sleep_reale = intervallo_pubblicazione_secondi / time_scale, un pavimento di
  # 0.1s in main.py impedisce comunque al ciclo di girare più veloce; con un
  # intervallo troppo basso, quel pavimento sovrascrive silenziosamente il valore
  # qui configurato (v. avviso_intervallo_sovrascritto in main.py).
  intervallo_pubblicazione_secondi: 900

  # normale | stress_idrico | ondata_di_calore
  # Sovrascrivibile da riga di comando con --scenario
  scenario: "normale"

# Tre parcelle dello stesso vigneto, vicine tra loro ma con micro-condizioni leggermente diverse (varietà, esposizione).
parcelle:
  - nome: parcellaA
    varieta: "Sangiovese"
    colore_bacca: "nero"          # nero | bianco -- influenza l'offset di temp_bacca (Gambetta, 2021)
    stadio_fenologico_germogli_cm: 12   # valore statico, usato dalla regola dei "tre dieci"
    latitudine: 41.1231
    longitudine: 16.8674
    nodi:
      - codice: meteo-A1
        tipo: meteo      # temp_aria, umidita_aria, pioggia, bagnatura_fogliare, velocita_vento
      - codice: idrico-A1
        tipo: idrico      # psi_stem
      - codice: bacca-A1
        tipo: bacca       # temp_bacca
      - codice: suolo-A1
        tipo: suolo       # temperatura_suolo, umidita_suolo

  - nome: parcellaB
    varieta: "Montepulciano"
    colore_bacca: "nero"
    stadio_fenologico_germogli_cm: 14
    latitudine: 41.1258
    longitudine: 16.8711
    nodi:
      - codice: meteo-B1
        tipo: meteo
      - codice: idrico-B1
        tipo: idrico
      - codice: bacca-B1
        tipo: bacca
      - codice: suolo-B1
        tipo: suolo

  - nome: parcellaC
    varieta: "Trebbiano"
    colore_bacca: "bianco"
    stadio_fenologico_germogli_cm: 10
    latitudine: 41.1204
    longitudine: 16.8639
    nodi:
      - codice: meteo-C1
        tipo: meteo
      - codice: idrico-C1
        tipo: idrico
      - codice: bacca-C1
        tipo: bacca
      - codice: suolo-C1
        tipo: suolo