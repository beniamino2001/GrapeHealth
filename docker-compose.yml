services:

  rabbitmq:
    build:
      context: .
      dockerfile: infra/rabbitmq/Dockerfile
      pull: true
    pull_policy: build
    container_name: grapehealth-rabbitmq
    hostname: grapehealth-rabbitmq
    ports:
      - "127.0.0.1:${RABBITMQ_AMQP_PORT}:${RABBITMQ_AMQP_PORT}"       # AMQPS
      - "127.0.0.1:${MQTT_PORT}:${MQTT_PORT}"                          # MQTT su TLS
      - "127.0.0.1:${RABBITMQ_MANAGEMENT_PORT}:${RABBITMQ_MANAGEMENT_PORT}"
      - "127.0.0.1:${RABBITMQ_MANAGEMENT_PORT_TLS}:${RABBITMQ_MANAGEMENT_PORT_TLS}"   # Management UI su TLS
    volumes:
      - ./infra/rabbitmq/rabbitmq.conf.template:/etc/rabbitmq/conf.d/10-grapehealth.conf.template:ro
      - ./infra/rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
      - ./infra/rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
      - rabbitmq-data:/var/lib/rabbitmq
    env_file:
      - .env
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "check_running" ]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    build:
      context: .
      dockerfile: infra/postgres/Dockerfile
      pull: true
    pull_policy: build
    container_name: grapehealth-postgres
    ports:
      - "127.0.0.1:${PG_PORT}:${PG_PORT}"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-grapehealth}
      POSTGRES_USER_FILE: /run/secrets/postgres_user
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    command:
      - "postgres"
      - "-c"
      - "ssl=on"
      - "-c"
      - "ssl_min_protocol_version=TLSv1.2"
      - "-c"
      - "ssl_cert_file=/var/lib/postgresql/certs/postgres.crt"
      - "-c"
      - "ssl_key_file=/var/lib/postgresql/certs/postgres.key"
      - "-c"
      - "ssl_ca_file=/var/lib/postgresql/certs/ca.crt"
      - "-c"
      - "hba_file=/var/lib/postgresql/certs/pg_hba.conf"
    secrets:
      - postgres_user
      - postgres_password
    volumes:
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
      - ./infra/postgres/pg_hba.conf:/var/lib/postgresql/certs/pg_hba.conf:ro
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$(cat /run/secrets/postgres_user)" ]
      interval: 10s
      timeout: 5s
      retries: 5

  tomcat:
    build:
      context: .
      dockerfile: infra/tomcat/Dockerfile
      pull: true
    container_name: grapehealth-tomcat
    ports:
      - "127.0.0.1:8081-8084:8081-8084"
    volumes:
      - ${TOMCAT_INSTANCES_DIR}:/opt/grapehealth/instances
      - ./infra/tomcat/istanze-escluse.conf:/opt/grapehealth/istanze-escluse.conf
      - ${SPRING_BOOT_LOGS_DIR}:/opt/grapehealth/logs
      - ./sensors-simulator/config/nodi.yaml:/opt/grapehealth/sensors-simulator/config/nodi.yaml:ro
      - ./sensors-simulator/scripts/init_nodi_db.py:/opt/grapehealth/sensors-simulator/scripts/init_nodi_db.py:ro
      - ./infra/tomcat/start-instances.sh:/usr/local/bin/start-instances.sh:ro
      - ./certs:/opt/grapehealth/certs:ro
    env_file:
      - .env
    environment:
      PG_HOST: postgres
      RABBITMQ_HOST: rabbitmq
      MQTT_HOST: rabbitmq
      SPRING_RABBITMQ_SSL_TRUST_STORE: "file:/opt/grapehealth/certs/truststore.p12"
      SPRING_RABBITMQ_SSL_TRUST_STORE_PASSWORD: "${TLS_KEYSTORE_PASSWORD}"
      SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:${PG_PORT}/${POSTGRES_DB}?sslmode=${POSTGRES_SSL_MODE:-verify-full}&sslrootcert=/opt/grapehealth/certs/ca.crt"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  nginx:
    build:
      context: .
      dockerfile: infra/nginx/Dockerfile
      pull: true
    container_name: grapehealth-nginx
    ports:
      - "127.0.0.1:443:443"
    depends_on:
      - tomcat

secrets:
  postgres_user:
    file: ./secrets/postgres_user.txt
  postgres_password:
    file: ./secrets/postgres_password.txt

volumes:
  rabbitmq-data:
  postgres-data:
